apiVersion: v1
kind: Pod
metadata:
  name: attacker-demo-session
  namespace: attacker-lab
  labels:
    app: secure-attacker
    session: demo-session
    role: attacker
    tier: frontend
spec:
  automountServiceAccountToken: false
  hostNetwork: false
  hostPID: false
  hostIPC: false
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: attacker
      image: secure-attacker:1.0
      imagePullPolicy: Never
      command:
        - "tail"
        - "-f"
        - "/dev/null"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: run-volume
          mountPath: /run
        - name: work-volume
          mountPath: /home/student/work
  volumes:
    - name: tmp-volume
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
    - name: run-volume
      emptyDir:
        medium: Memory
        sizeLimit: 16Mi
    - name: work-volume
      emptyDir:
        medium: Memory
        sizeLimit: 128Mi
  restartPolicy: Always
  terminationGracePeriodSeconds: 5
