apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-demo-session-target
  namespace: attacker-lab
  labels:
    session: demo-session
spec:
  podSelector:
    matchLabels:
      app: target-nginx
      session: demo-session
  policyTypes:
    - Ingress
  ingress:
    # Allow incoming traffic ONLY from the attacker container in the same session
    - from:
        - podSelector:
            matchLabels:
              app: secure-attacker
              session: demo-session
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-demo-session-attacker
  namespace: attacker-lab
  labels:
    session: demo-session
spec:
  podSelector:
    matchLabels:
      app: secure-attacker
      session: demo-session
  policyTypes:
    - Ingress
    - Egress
  # Deny all ingress into attacker
  ingress: []
  egress:
    # Allow DNS resolution to CoreDNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTP egress ONLY to the assigned target in the same session
    - to:
        - podSelector:
            matchLabels:
              app: target-nginx
              session: demo-session
      ports:
        - protocol: TCP
          port: 80
